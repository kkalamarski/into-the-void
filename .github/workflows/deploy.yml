name: Deploy

on:
  push:
    tags:
      - 'v*'  # Match version tags like v1.19.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to deploy (e.g., 1.24.3)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, game-server, web]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.service == 'web' && format('VITE_API_URL=https://api.{0}/api', secrets.DOMAIN || 'innervoid.online') || '' }}
            ${{ matrix.service == 'web' && format('VITE_GAME_SERVER_URL=wss://game.{0}', secrets.DOMAIN || 'innervoid.online') || '' }}

  deploy:
    name: Deploy to Swarm
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    environment: DEV

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Copy deployment files
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-stack.yml \
            deploy/deploy.sh \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/itv/

      - name: Copy database migrations
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /opt/itv/drizzle"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            packages/database/drizzle/*.sql \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/itv/drizzle/

      - name: Create environment file
        run: |
          cat > /tmp/.env << EOF
          export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          export JWT_SECRET=${{ secrets.JWT_SECRET }}
          export POSTGRES_USER=postgres
          export POSTGRES_DB=into_the_void
          export DOMAIN=${{ secrets.DOMAIN || 'innervoid.online' }}
          export REGISTRY=${{ env.REGISTRY }}/${{ github.repository }}
          export TAG=${{ steps.version.outputs.tag }}
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/.env
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/.env \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/itv/.env

      - name: Deploy to Swarm
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/itv && source .env && chmod +x deploy.sh && ./deploy.sh \$TAG \$REGISTRY"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker stack services itv"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
