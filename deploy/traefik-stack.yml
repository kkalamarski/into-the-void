version: '3.8'

services:
  traefik:
    image: traefik:v3.3
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager  # Run on manager nodes only
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        # Dashboard routing (secured)
        - "traefik.enable=true"
        - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-innervoid.online}`)"
        - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
        - "traefik.http.routers.traefik-dashboard.tls=true"
        - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.traefik-dashboard.service=api@internal"
        - "traefik.http.routers.traefik-dashboard.middlewares=auth"
        # Basic auth middleware (password hashed with htpasswd)
        - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-admin:$$apr1$$8EVjn/nj$$GiLUZqcbueTFeD23SuB6x0}"
        # Port for Docker provider (Swarm API)
        - "traefik.http.services.dummy.loadbalancer.server.port=9999"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_certs:/letsencrypt
    environment:
      - DOMAIN=${DOMAIN:-innervoid.online}
      - ACME_EMAIL=${ACME_EMAIL:-admin@innervoid.online}
    networks:
      - traefik-public

volumes:
  traefik_certs:
    driver: local

networks:
  traefik-public:
    driver: overlay
    attachable: true
