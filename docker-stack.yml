version: '3.8'

services:
  # Database services
  postgres:
    image: postgres:16-alpine
    deploy:
      placement:
        constraints:
          - node.role == manager  # Database on manager for volume access
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-into_the_void}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Application services
  api:
    image: ${REGISTRY:-ghcr.io/owner/repo}/api:${TAG:-latest}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_traefik-public"
        - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-innervoid.online}`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls=true"
        - "traefik.http.routers.api.tls.certresolver=letsencrypt"
        - "traefik.http.services.api.loadbalancer.server.port=3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-into_the_void}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - internal
      - traefik-public

  game-server:
    image: ${REGISTRY:-ghcr.io/owner/repo}/game-server:${TAG:-latest}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_traefik-public"
        - "traefik.http.routers.game-server.rule=Host(`game.${DOMAIN:-innervoid.online}`)"
        - "traefik.http.routers.game-server.entrypoints=websecure"
        - "traefik.http.routers.game-server.tls=true"
        - "traefik.http.routers.game-server.tls.certresolver=letsencrypt"
        - "traefik.http.services.game-server.loadbalancer.server.port=3001"
        - "traefik.http.services.game-server.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.game-server.loadbalancer.sticky.cookie.name=game_session"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-into_the_void}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - internal
      - traefik-public

  web:
    image: ${REGISTRY:-ghcr.io/owner/repo}/web:${TAG:-latest}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_traefik-public"
        # HTTPS router
        - "traefik.http.routers.web.rule=Host(`play.${DOMAIN:-innervoid.online}`)"
        - "traefik.http.routers.web.entrypoints=websecure"
        - "traefik.http.routers.web.tls=true"
        - "traefik.http.routers.web.tls.certresolver=letsencrypt"
        # HTTP to HTTPS redirect
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
        - "traefik.http.routers.web-http.rule=Host(`play.${DOMAIN:-innervoid.online}`)"
        - "traefik.http.routers.web-http.entrypoints=web"
        - "traefik.http.routers.web-http.middlewares=redirect-to-https"
        # Load balancer
        - "traefik.http.services.web.loadbalancer.server.port=80"
    networks:
      - traefik-public

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  internal:
    driver: overlay
    internal: true  # No external access
  traefik-public:
    name: traefik_traefik-public
    external: true  # Created by Traefik stack
